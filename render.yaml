services:
  - type: web
    name: url-shortener
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: TRUSTED_PROXY
        value: "true"
      - key: REJECT_PRIVATE_IPS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: url-shortener-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: url-shortener-kv
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: url-shortener
          property: host

  - type: keyvalue
    name: url-shortener-kv
    plan: free
    region: oregon
    ipAllowList: []

databases:
  - name: url-shortener-db
    plan: free
    region: oregon
    databaseName: shortener
